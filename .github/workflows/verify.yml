name: Verify focused extraction

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check TypeScript
        run: npm run check
      - name: Build and exercise the complete lifecycle
        run: npm test
